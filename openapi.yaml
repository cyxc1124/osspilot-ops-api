openapi: 3.1.0
info:
  title: OssPilot Ops API
  version: 0.1.0
paths:
  /healthz:
    get:
      summary: Liveness
      responses:
        "200":
          description: ok
  /api/login:
    post:
      summary: Ops portal login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
                portal: { type: string, enum: [ops] }
      responses:
        "200":
          description: JWT and user brief; includes must_change_password
  /api/logout:
    post:
      summary: Stateless logout
      responses:
        "200":
          description: client should discard token
  /api/me:
    get:
      summary: Current ops user
      responses:
        "200":
          description: profile including must_change_password
  /api/password/change:
    post:
      summary: Change password
      responses:
        "200":
          description: changed
  /api/users:
    get:
      summary: List ops users
      responses:
        "200":
          description: items and total
        "403":
          description: not platform_admin
    post:
      summary: Create ops user
      responses:
        "201":
          description: created
        "409":
          description: username taken
  /api/users/{user_id}:
    get:
      summary: Get ops user
      responses:
        "200":
          description: user
        "404":
          description: not found
    put:
      summary: Update ops user
      responses:
        "200":
          description: updated
    delete:
      summary: Delete ops user
      responses:
        "204":
          description: deleted
  /api/users/{user_id}/password/reset:
    post:
      summary: Reset ops user password
      responses:
        "200":
          description: Password reset
