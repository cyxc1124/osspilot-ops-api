openapi: 3.1.0
info:
  title: OssPilot Ops API
  version: 0.1.0
paths:
  /healthz:
    get:
      summary: Liveness
      responses:
        "200":
          description: ok
  /api/login:
    post:
      summary: Ops portal login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
                portal: { type: string, enum: [ops] }
      responses:
        "200":
          description: JWT and user brief; includes must_change_password
  /api/logout:
    post:
      summary: Stateless logout
      responses:
        "200":
          description: client should discard token
  /api/me:
    get:
      summary: Current ops user
      responses:
        "200":
          description: profile including must_change_password
  /api/password/change:
    post:
      summary: Change password
      responses:
        "200":
          description: changed
  /api/users:
    get:
      summary: List ops users
      responses:
        "200":
          description: items and total
        "403":
          description: not platform_admin
    post:
      summary: Create ops user
      responses:
        "201":
          description: created
        "409":
          description: username taken
  /api/users/{user_id}:
    get:
      summary: Get ops user
      responses:
        "200":
          description: user
        "404":
          description: not found
    put:
      summary: Update ops user
      responses:
        "200":
          description: updated
    delete:
      summary: Delete ops user
      responses:
        "204":
          description: deleted
  /api/users/{user_id}/password/reset:
    post:
      summary: Reset ops user password
      responses:
        "200":
          description: Password reset
  /api/regions:
    get:
      summary: List storage regions
      responses:
        "200":
          description: items and total
    post:
      summary: Create storage region
      responses:
        "201":
          description: created
        "409":
          description: code taken
  /api/regions/{region_id}:
    put:
      summary: Update storage region
      responses:
        "200":
          description: updated
        "404":
          description: not found
    delete:
      summary: Delete storage region
      responses:
        "204":
          description: deleted
        "409":
          description: default region
  /api/settings:
    get:
      summary: Platform settings (secrets masked)
      responses:
        "200":
          description: settings
    put:
      summary: Update platform settings
      responses:
        "200":
          description: updated
        "403":
          description: not platform_admin
  /api/tenant-users:
    get:
      summary: List tenant accounts
      responses:
        "200":
          description: items and total
    post:
      summary: Create tenant account
      responses:
        "201":
          description: created
        "409":
          description: username taken
  /api/tenant-users/{user_id}:
    get:
      summary: Get tenant account
      responses:
        "200":
          description: account
        "404":
          description: not found
    put:
      summary: Update tenant account
      responses:
        "200":
          description: updated
    delete:
      summary: Delete tenant account
      responses:
        "204":
          description: deleted
  /api/tenant-users/{user_id}/password/reset:
    post:
      summary: Reset tenant account password
      responses:
        "200":
          description: Password reset
  /api/buckets:
    get:
      summary: List registered platform buckets
      responses:
        "200":
          description: items and total
    post:
      summary: Register a bucket name
      responses:
        "201":
          description: registered
        "409":
          description: name taken
  /api/buckets/import-batch:
    post:
      summary: Register many bucket names
      responses:
        "200":
          description: imported and failed
  /api/s3/buckets:
    get:
      summary: Discover RGW buckets (empty until storage client)
      responses:
        "200":
          description: items and total
  /api/tenant-users/{user_id}/buckets:
    get:
      summary: List buckets granted to a tenant account
      responses:
        "200":
          description: items and total
    put:
      summary: Replace grants and project to tenant API
      responses:
        "200":
          description: items and total
        "409":
          description: bucket limit exceeded
  /api/tenant-users/{user_id}/buckets/{bucket_id}:
    delete:
      summary: Revoke one grant
      responses:
        "204":
          description: revoked
        "404":
          description: grant not found
  /api/lifecycle-rules:
    get:
      summary: List lifecycle rules
      responses:
        "200":
          description: items and total
  /api/buckets/{bucket_id}/lifecycle-rules:
    post:
      summary: Create a lifecycle rule for a registered bucket
      responses:
        "201":
          description: created
        "404":
          description: bucket not found
  /api/lifecycle-rules/{rule_id}:
    put:
      summary: Update a lifecycle rule
      responses:
        "200":
          description: updated
        "404":
          description: not found
    delete:
      summary: Delete a lifecycle rule
      responses:
        "204":
          description: deleted
  /api/ops/rgw/instances:
    get:
      summary: List RGW instances from Ceph management API
      responses:
        "200":
          description: available flag and instances
  /api/ops/rgw/stats:
    get:
      summary: RGW request volume and error rate
      responses:
        "200":
          description: stats or degraded
  /api/ops/cluster/health:
    get:
      summary: Ceph cluster health
      responses:
        "200":
          description: HEALTH_OK / WARN / ERR or degraded
  /api/ops/cluster/info:
    get:
      summary: Ceph version and capacity
      responses:
        "200":
          description: info or degraded
  /api/ops/s3/test:
    post:
      summary: List buckets against configured RGW
      responses:
        "200":
          description: ok flag
  /api/ops/rgw/restart:
    post:
      summary: Restart RGW daemons
      responses:
        "200":
          description: restart result
        "503":
          description: management API unavailable
  /api/ops/rgw/rolling-restart:
    post:
      summary: Rolling restart RGW daemons
      responses:
        "200":
          description: restart result
        "503":
          description: management API unavailable
  /api/stats/overview:
    get:
      summary: Platform capacity overview
      responses:
        "200":
          description: counts; used bytes 0 without object stats
  /api/stats/tenants/ranking:
    get:
      summary: Tenant capacity ranking
      responses:
        "200":
          description: items
  /api/stats/storage-classes:
    get:
      summary: Storage class usage
      responses:
        "200":
          description: items
  /api/stats/traffic:
    get:
      summary: Platform traffic
      responses:
        "200":
          description: zeros until access logs
  /api/stats/traffic/daily:
    get:
      summary: Daily traffic
      responses:
        "200":
          description: items
  /api/stats/performance:
    get:
      summary: RGW performance plus audit counts
      responses:
        "200":
          description: stats
  /api/stats/behavior/users:
    get:
      summary: User behavior ranking
      responses:
        "200":
          description: items
  /api/stats/buckets/ranking:
    get:
      summary: Bucket traffic ranking
      responses:
        "200":
          description: items
  /api/stats/prefixes/ranking:
    get:
      summary: Prefix access ranking
      responses:
        "200":
          description: items
  /api/audit-logs:
    get:
      summary: List ops audit logs
      responses:
        "200":
          description: items
  /api/audit-logs/export:
    get:
      summary: Export audit logs as CSV
      responses:
        "200":
          description: csv
  /api/alerts/rules:
    get:
      summary: List alert rules
      responses:
        "200":
          description: items
    post:
      summary: Create alert rule
      responses:
        "201":
          description: created
  /api/alerts/rules/{rule_id}:
    get:
      summary: Get alert rule
      responses:
        "200":
          description: rule
    put:
      summary: Update alert rule
      responses:
        "200":
          description: updated
    delete:
      summary: Delete alert rule
      responses:
        "204":
          description: deleted
  /api/alerts/channels:
    get:
      summary: List notification channels
      responses:
        "200":
          description: items
    post:
      summary: Create notification channel
      responses:
        "201":
          description: created
  /api/alerts/channels/{channel_id}:
    put:
      summary: Update notification channel
      responses:
        "200":
          description: updated
    delete:
      summary: Delete notification channel
      responses:
        "204":
          description: deleted
  /api/alerts/events:
    get:
      summary: List alert events
      responses:
        "200":
          description: items
  /api/alerts/events/recent:
    get:
      summary: Recent alert events
      responses:
        "200":
          description: items
  /api/alerts/events/{event_id}/acknowledge:
    post:
      summary: Acknowledge an alert event
      responses:
        "200":
          description: event
  /api/alerts/events/{event_id}/resolve:
    post:
      summary: Resolve an alert event
      responses:
        "200":
          description: event
  /api/alerts/evaluate:
    post:
      summary: Evaluate alert rules
      responses:
        "200":
          description: counts

