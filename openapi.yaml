openapi: 3.1.0
info:
  title: OssPilot Ops API
  version: 0.1.0
paths:
  /healthz:
    get:
      summary: Liveness
      responses:
        "200":
          description: ok
  /api/login:
    post:
      summary: Ops portal login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
                portal: { type: string, enum: [ops] }
      responses:
        "200":
          description: JWT and user brief
  /api/logout:
    post:
      summary: Stateless logout
      responses:
        "200":
          description: client should discard token
  /api/me:
    get:
      summary: Current ops user
      responses:
        "200":
          description: profile
  /api/password/change:
    post:
      summary: Change password
      responses:
        "200":
          description: changed
